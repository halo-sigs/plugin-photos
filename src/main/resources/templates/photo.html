<!doctype html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{layout :: html(head = ~{::head}, content = ~{::content})}">
    <th:block th:fragment="head">
        <title th:text="|${title} - ${site.title}|">照片</title>
        <style>
            :where(
                .photo-back,
                .photo-figure,
                .photo-details,
                .photo-exif,
                .photo-navigation,
                .photo-neighbors,
                .photo-comments
            ) {
                margin-block: 1.5rem;
            }

            :where(.photo-image) {
                display: block;
                width: auto;
                max-width: 100%;
                max-height: 75vh;
                margin: 0 auto;
                border-radius: 0.5rem;
            }

            :where(.photo-caption) {
                margin-top: 1rem;
            }

            :where(.photo-title) {
                margin-bottom: 0.5rem;
            }

            :where(.photo-tags, .photo-neighbors__list) {
                display: flex;
                flex-wrap: wrap;
                gap: 0.75rem;
                margin: 0;
                padding: 0;
                list-style: none;
            }

            :where(.photo-position) {
                opacity: 0.7;
            }

            :where(.photo-details__list, .photo-exif__list) {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr));
                gap: 1rem;
            }

            :where(.photo-details__item, .photo-exif__item) {
                display: grid;
                gap: 0.25rem;
            }

            :where(.photo-details__item dd, .photo-exif__item dd) {
                margin: 0;
            }

            :where(.photo-navigation) {
                display: flex;
                gap: 1rem;
            }

            :where(.photo-navigation__next) {
                margin-left: auto;
                text-align: right;
            }

            :where(.photo-navigation__label) {
                display: block;
                font-size: 0.875rem;
                opacity: 0.7;
            }

            :where(.photo-neighbor__image) {
                display: block;
                width: 6rem;
                aspect-ratio: 1;
                object-fit: cover;
                border-radius: 0.375rem;
            }

            :where(.photo-neighbor.is-current .photo-neighbor__link) {
                font-weight: 600;
            }
        </style>
    </th:block>

    <th:block th:fragment="content">
        <article
            class="photo-page"
            th:attr="data-template-id=${_templateId},data-photo-name=${photo.metadata.name},data-permalink=${photo.permalink},data-group=${group},data-page=${page},data-size=${size}"
        >
            <nav class="photo-back" aria-label="返回图库">
                <a class="photo-back__link" th:href="${backUrl}">返回图库</a>
            </nav>

            <figure class="photo-figure">
                <img class="photo-image" th:src="${photo.spec.url}" th:alt="${photo.spec.displayName}" />
                <figcaption class="photo-caption">
                    <h1 class="photo-title" th:text="${title}">照片</h1>
                    <p
                        class="photo-description"
                        th:if="${!#strings.isEmpty(photo.spec.description)}"
                        th:text="${photo.spec.description}"
                    ></p>
                    <ul class="photo-tags" th:if="${!#lists.isEmpty(photo.spec.tags)}" aria-label="照片标签">
                        <li class="photo-tag" th:each="tag : ${photo.spec.tags}" th:text="${tag}"></li>
                    </ul>
                    <p class="photo-position">
                        第 <span class="photo-position__current" th:text="${position}">1</span> 张，共
                        <span class="photo-position__total" th:text="${total}">1</span> 张
                    </p>
                </figcaption>
            </figure>

            <section
                class="photo-details"
                th:if="${!#strings.isEmpty(photo.spec.groupName) || photo.metadata.creationTimestamp != null}"
            >
                <h2 class="photo-details__title">照片信息</h2>
                <dl class="photo-details__list">
                    <div class="photo-details__item" th:if="${!#strings.isEmpty(photo.spec.groupName)}">
                        <dt>分组</dt>
                        <dd>
                            <a th:href="${photoUrl.list(photo.spec.groupName)}" th:text="${photo.spec.groupName}"
                                >分组</a
                            >
                        </dd>
                    </div>
                    <div class="photo-details__item" th:if="${photo.metadata.creationTimestamp != null}">
                        <dt>添加时间</dt>
                        <dd>
                            <time
                                th:datetime="${photo.metadata.creationTimestamp}"
                                th:text="${#temporals.format(photo.metadata.creationTimestamp, 'yyyy-MM-dd HH:mm:ss')}"
                            ></time>
                        </dd>
                    </div>
                </dl>
            </section>

            <section class="photo-exif" th:if="${photo.exif != null}">
                <h2 class="photo-exif__title">拍摄信息</h2>
                <dl class="photo-exif__list">
                    <div class="photo-exif__item photo-exif__item--make" th:if="${!#strings.isEmpty(photo.exif.make)}">
                        <dt>相机厂商</dt>
                        <dd th:text="${photo.exif.make}"></dd>
                    </div>
                    <div
                        class="photo-exif__item photo-exif__item--model"
                        th:if="${!#strings.isEmpty(photo.exif.model)}"
                    >
                        <dt>相机型号</dt>
                        <dd th:text="${photo.exif.model}"></dd>
                    </div>
                    <div
                        class="photo-exif__item photo-exif__item--lens"
                        th:if="${!#strings.isEmpty(photo.exif.lensModel)}"
                    >
                        <dt>镜头</dt>
                        <dd th:text="${photo.exif.lensModel}"></dd>
                    </div>
                    <div class="photo-exif__item photo-exif__item--date" th:if="${photo.exif.dateTimeOriginal != null}">
                        <dt>拍摄时间</dt>
                        <dd>
                            <time
                                th:datetime="${photo.exif.dateTimeOriginal}"
                                th:text="${#temporals.format(photo.exif.dateTimeOriginal, 'yyyy-MM-dd HH:mm:ss')}"
                            ></time>
                        </dd>
                    </div>
                    <div class="photo-exif__item photo-exif__item--aperture" th:if="${photo.exif.fNumber != null}">
                        <dt>光圈</dt>
                        <dd th:text="|f/${photo.exif.fNumber}|"></dd>
                    </div>
                    <div
                        class="photo-exif__item photo-exif__item--exposure"
                        th:if="${!#strings.isEmpty(photo.exif.exposureTime)}"
                    >
                        <dt>曝光时间</dt>
                        <dd th:text="|${photo.exif.exposureTime} 秒|"></dd>
                    </div>
                    <div class="photo-exif__item photo-exif__item--iso" th:if="${photo.exif.iso != null}">
                        <dt>感光度</dt>
                        <dd th:text="|ISO ${photo.exif.iso}|"></dd>
                    </div>
                    <div
                        class="photo-exif__item photo-exif__item--focal-length"
                        th:if="${photo.exif.focalLength != null}"
                    >
                        <dt>焦距</dt>
                        <dd th:text="|${photo.exif.focalLength} mm|"></dd>
                    </div>
                    <div
                        class="photo-exif__item photo-exif__item--focal-length-35mm"
                        th:if="${photo.exif.focalLengthIn35mm != null}"
                    >
                        <dt>35mm 等效焦距</dt>
                        <dd th:text="|${photo.exif.focalLengthIn35mm} mm|"></dd>
                    </div>
                    <div class="photo-exif__item photo-exif__item--width" th:if="${photo.exif.imageWidth != null}">
                        <dt>图像宽度</dt>
                        <dd th:text="|${photo.exif.imageWidth} px|"></dd>
                    </div>
                    <div class="photo-exif__item photo-exif__item--height" th:if="${photo.exif.imageHeight != null}">
                        <dt>图像高度</dt>
                        <dd th:text="|${photo.exif.imageHeight} px|"></dd>
                    </div>
                    <div class="photo-exif__item photo-exif__item--flash" th:if="${photo.exif.flash != null}">
                        <dt>闪光灯标记</dt>
                        <dd th:text="${photo.exif.flash}"></dd>
                    </div>
                    <div
                        class="photo-exif__item photo-exif__item--white-balance"
                        th:if="${photo.exif.whiteBalance != null}"
                    >
                        <dt>白平衡标记</dt>
                        <dd th:text="${photo.exif.whiteBalance}"></dd>
                    </div>
                    <div
                        class="photo-exif__item photo-exif__item--exposure-mode"
                        th:if="${photo.exif.exposureMode != null}"
                    >
                        <dt>曝光模式标记</dt>
                        <dd th:text="${photo.exif.exposureMode}"></dd>
                    </div>
                    <div
                        class="photo-exif__item photo-exif__item--exposure-program"
                        th:if="${photo.exif.exposureProgram != null}"
                    >
                        <dt>曝光程序标记</dt>
                        <dd th:text="${photo.exif.exposureProgram}"></dd>
                    </div>
                    <div
                        class="photo-exif__item photo-exif__item--metering-mode"
                        th:if="${photo.exif.meteringMode != null}"
                    >
                        <dt>测光模式标记</dt>
                        <dd th:text="${photo.exif.meteringMode}"></dd>
                    </div>
                    <div
                        class="photo-exif__item photo-exif__item--software"
                        th:if="${!#strings.isEmpty(photo.exif.software)}"
                    >
                        <dt>处理软件</dt>
                        <dd th:text="${photo.exif.software}"></dd>
                    </div>
                </dl>
            </section>

            <nav class="photo-navigation" th:if="${prev != null || next != null}" aria-label="照片导航">
                <a class="photo-navigation__previous" th:if="${prev != null}" th:href="${photoUrl.detail(prev)}">
                    <span class="photo-navigation__label">上一张</span>
                    <strong class="photo-navigation__title" th:text="${prev.spec.displayName}">上一张照片</strong>
                </a>
                <a class="photo-navigation__next" th:if="${next != null}" th:href="${photoUrl.detail(next)}">
                    <span class="photo-navigation__label">下一张</span>
                    <strong class="photo-navigation__title" th:text="${next.spec.displayName}">下一张照片</strong>
                </a>
            </nav>

            <section class="photo-neighbors" th:if="${!#lists.isEmpty(neighbors)}">
                <h2 class="photo-neighbors__title">附近照片</h2>
                <ul class="photo-neighbors__list">
                    <li
                        class="photo-neighbor"
                        th:each="neighbor : ${neighbors}"
                        th:classappend="${neighbor.metadata.name == photo.metadata.name} ? 'is-current' : ''"
                        th:attr="data-photo-name=${neighbor.metadata.name}"
                    >
                        <a
                            class="photo-neighbor__link"
                            th:href="${photoUrl.detail(neighbor)}"
                            th:attr="aria-current=${neighbor.metadata.name == photo.metadata.name ? 'page' : null}"
                        >
                            <img
                                class="photo-neighbor__image"
                                th:src="${#strings.isEmpty(neighbor.spec.cover) ? neighbor.spec.url : neighbor.spec.cover}"
                                th:alt="${neighbor.spec.displayName}"
                                loading="lazy"
                            />
                            <span class="photo-neighbor__title" th:text="${neighbor.spec.displayName}">照片</span>
                        </a>
                    </li>
                </ul>
            </section>

            <section class="photo-comments" th:if="${haloCommentEnabled}">
                <h2 class="photo-comments__title">评论</h2>
                <halo:comment group="core.halo.run" kind="Photo" th:attr="name=${photo.metadata.name}" />
            </section>
        </article>
    </th:block>
</html>
